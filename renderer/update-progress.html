<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>업데이트 중</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", "Segoe UI", sans-serif;
      background: #0b1220;
      color: #eef3fa;
      user-select: none;
      -webkit-app-region: drag;
    }
    .wrap { padding: 22px 24px 18px; }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 14px;
      font-size: 12px;
      color: #93a4b8;
      line-height: 1.45;
    }
    #status {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      color: #d7e6f8;
      min-height: 1.4em;
    }
    #detail {
      margin: 0 0 14px;
      font-size: 12px;
      color: #8fa2b8;
      min-height: 1.35em;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bar-wrap {
      position: relative;
      height: 22px;
      border-radius: 11px;
      background: #172233;
      border: 1px solid #2d425c;
      overflow: hidden;
    }
    #fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1f6feb, #3dd6f5);
      transition: width 0.18s ease;
    }
    #fill.indeterminate {
      width: 40% !important;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
    #pct {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #7ec8ff;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 14px;
    }
    .step {
      text-align: center;
      font-size: 11px;
      color: #6f8299;
      padding: 6px 2px;
      border-radius: 8px;
      background: #121a27;
      border: 1px solid #243247;
    }
    .step.on {
      color: #e8f3ff;
      border-color: #3b82f6;
      background: #17263b;
      font-weight: 700;
    }
    .step.done {
      color: #86efac;
      border-color: #22c55e55;
    }
    .step.fail {
      color: #fecaca;
      border-color: #ef4444aa;
      background: #2a1515;
    }
    #banner {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      -webkit-app-region: no-drag;
    }
    #banner.info { display: block; background: #13253d; color: #b6d4ff; border: 1px solid #2f5f9a; }
    #banner.ok { display: block; background: #122a1c; color: #86efac; border: 1px solid #228b4a; }
    #banner.err { display: block; background: #2a1515; color: #fecaca; border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Landing Auto Deploy 업데이트</h1>
    <p class="sub">게이지·단계가 멈추면 실패입니다. 설치 창이 뜨면 앱이 종료되고 새 버전이 자동 실행됩니다.</p>
    <p id="status">준비 중…</p>
    <p id="detail"></p>
    <div class="bar-wrap"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div class="steps">
      <div class="step" id="s1">1.다운로드</div>
      <div class="step" id="s2">2.압축해제</div>
      <div class="step" id="s3">3.설치시작</div>
      <div class="step" id="s4">4.재실행</div>
    </div>
    <div id="banner"></div>
  </div>
  <script>
    const stepOrder = ['download', 'extract', 'install', 'restart'];
    function setStep(active, failed) {
      const map = { download: 's1', extract: 's2', install: 's3', restart: 's4' };
      const idx = stepOrder.indexOf(active);
      stepOrder.forEach((name, i) => {
        const el = document.getElementById(map[name]);
        if (!el) return;
        el.className = 'step';
        if (failed && name === active) el.classList.add('fail');
        else if (i < idx) el.classList.add('done');
        else if (i === idx) el.classList.add('on');
      });
    }

    window.setUpdateProgress = function (done, total, text, meta) {
      const status = document.getElementById('status');
      const detail = document.getElementById('detail');
      const fill = document.getElementById('fill');
      const pctEl = document.getElementById('pct');
      const banner = document.getElementById('banner');
      const m = meta || {};

      if (text) status.textContent = text;
      if (m.detail != null) detail.textContent = m.detail;

      let pct = 0;
      let indeterminate = false;
      if (total > 0) pct = Math.min(100, Math.round((done * 100) / total));
      else if (typeof done === 'number' && done >= 0 && done <= 100) pct = done;
      if (m.indeterminate) indeterminate = true;

      fill.classList.toggle('indeterminate', !!indeterminate);
      if (!indeterminate) fill.style.width = pct + '%';
      pctEl.textContent = indeterminate ? '진행 중…' : (pct + '%');

      const stage = m.stage || (
        /다운로드/.test(text || '') ? 'download'
          : /압축|해제/.test(text || '') ? 'extract'
            : /설치|스크립트|복사/.test(text || '') ? 'install'
              : /재실행|종료/.test(text || '') ? 'restart'
                : 'download'
      );
      setStep(stage, !!m.failed);

      if (m.failed) {
        banner.className = 'err';
        banner.textContent = m.banner || '업데이트 실패 — 앱은 종료하지 않습니다. 로그를 확인하세요.';
      } else if (m.ok) {
        banner.className = 'ok';
        banner.textContent = m.banner || '설치 스크립트가 시작되었습니다. 곧 앱이 종료되고 새 버전이 실행됩니다.';
      } else if (m.banner) {
        banner.className = 'info';
        banner.textContent = m.banner;
      } else {
        banner.className = '';
        banner.textContent = '';
      }
    };
  </script>
</body>
</html>
